<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>BELIÊ - Discos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <h1>Cadastro de Discos</h1>

    <p><a href="dashboard.html">Voltar ao painel</a></p>
    <button id="sairBtn">Sair</button>

    <hr>

    <h2>Novo Disco</h2>


    <form id="discoForm">
        <input type="hidden" id="discoId">

        <label for="titulo">Título do disco:</label>
        <input type="text" id="titulo" required maxlength="150">

        <label for="artista">Artista ou banda:</label>
        <input type="text" id="artista" required maxlength="100">

        <label for="preco_custo">Preço de custo (R$):</label>
        <input type="number" id="preco_custo" min="0" step="0.01" required>

        <label for="quantidade_estoque">Quantidade em estoque:</label>
        <input type="number" id="quantidade_estoque" min="0" step="1" required>

        <label for="estoque_minimo">Estoque mínimo:</label>
        <input type="number" id="estoque_minimo" min="0" step="1" required>

        <button type="submit">Salvar disco</button>
        <button type="button" id="cancelarBtn">Cancelar</button>
    </form>


    <hr>

    <h2>Discos cadastrados</h2>

    <input type="text" id="campoBusca" placeholder="Pesquisar disco">

    <table>

        <thead>
            <tr>
                <th>Título</th>
                <th>Artista/Banda</th>
                <th>Preço de custo</th>
                <th>Quantidade em estoque</th>
                <th>Estoque mínimo</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="listaDiscos"></tbody>

    </table>

    <script src="../js/produtos.js"></script>
</body>

</html>
