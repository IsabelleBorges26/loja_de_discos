<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>BELIÊ - Estoque</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <h1>Gestão de Acervo e Vendas</h1>

    <p><a href="dashboard.html">Voltar ao painel</a></p>
    <button id="sairBtn">Sair</button>

    <hr>

    <h2>Registrar movimentação</h2>

    <form id="movimentacaoForm">
        <label for="disco">Disco:</label>
        <select id="disco" required></select>

        <label for="tipo">Tipo de movimentação:</label>
        <select id="tipo">
            <option value="entrada">Reposição / Compra (entrada)</option>
            <option value="saida">Venda (saída)</option>
        </select>

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" min="1" step="1" required>

        <label for="data">Data da movimentação:</label>
        <input type="date" id="data" required>

        <label for="observacao">Observação:</label>
        <input type="text" id="observacao" maxlength="250">

        <button type="submit">Registrar</button>
    </form>

    <p id="movMensagem"></p>

    <hr>

    <h2>Acervo (ordem alfabética)</h2>

    <table>
        <thead>
            <tr>
                <th>Disco</th>
                <th>Artista</th>
                <th>Quantidade</th>
                <th>Mínimo</th>
                <th>Situação</th>
            </tr>
        </thead>
        <tbody id="listaEstoque"></tbody>
    </table>

    <hr>

    <h2>Histórico de movimentações</h2>

    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>Disco</th>
                <th>Tipo</th>
                <th>Quantidade</th>
                <th>Responsável</th>
            </tr>
        </thead>
        <tbody id="listaMovimentacoes"></tbody>
    </table>

    <script src="../js/producao.js"></script>
</body>
</html>
