<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>BELIÊ - Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <h1>BELIÊ</h1>
    <h2>Controle de Discos</h2>

        <p id="loginMensagem"></p>

    <script src="../js/login.js"></script>
</body>
</html>
